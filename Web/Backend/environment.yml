name: scisketch-backend-dev-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8  # Adjust the Python version as needed
  - numpy
  - pandas
  - pytest
  - pytest-asyncio
  - pytest-xdist
  - PyYAML
  - sympy
  - pip
  - pip:
      - torch
      - flask_sqlalchemy
      - flask_migrate
      - aiohttp
      - cachetools
      - ecdsa
      - eth-hash[pycryptodome]
      - execnet
      - fastecdsa
      - frozendict
      - gprof2dot
      - lark
      - marshmallow-dataclass>=7.1.0
      - marshmallow-enum
      - marshmallow-oneofschema
      - marshmallow>=3.2.1
      - mpmath
      - pipdeptree
      - prometheus-client
      - pytest-profiling
      - typeguard<3.0.0
      - web3
      - huggingface-hub
      - cssselect2
      - defusedxml
      - tinycss2
      - sentence_transformers
      - chromadb
      - SentencePiece
      - Pillow
      - flask_cors
      - CairoSVG
      - pycairo
      - git+https://github.com/openai/CLIP.git